<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorimetry Glossary — Project Jan</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="Plain-language glossary of colorimetry terms: Delta E, CIE76, CIE94, CMC l:c, CIEDE2000, L*a*b*, D65, metamerism, instrument geometry, gloss, tolerance and more.">
<meta property="og:type" content="website">
<meta property="og:title" content="Colorimetry Glossary — Project Jan">
<meta property="og:description" content="Plain-language glossary of colorimetry terms — Delta E, CIELAB, illuminants, instrument geometry, gloss, tolerance.">
<meta property="og:image" content="https://projectjan.cz/favicon.png">
<meta property="og:url" content="https://projectjan.cz/color/glossary/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ui.css">
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="/color/">Colorimetry</a> / Glossary</div>
  <h1>Colorimetry Glossary</h1>
  <p class="sub">Every term used across the calculator and training, in plain language. Search or scroll.</p>

  <div class="search-wrap">
    <div class="search-input-row">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M15 15l-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="glossary-search" placeholder="Search a term — e.g. &quot;D65&quot;, &quot;ΔE&quot;, &quot;metamerism&quot;…" autocomplete="off">
    </div>
  </div>

  <div id="term-list" class="search-results"></div>

  <div class="tcards" style="margin-top:2rem">
    <a class="tcard" href="/color/training/">
      <div class="tcard-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H10v12H4.5c-.8 0-1.5-.7-1.5-1.5v-9z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M17 5.5c0-.8-.7-1.5-1.5-1.5H10v12h5.5c.8 0 1.5-.7 1.5-1.5v-9z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
      <div class="tcard-body"><strong>Back to training</strong><span>See these terms explained in context</span></div>
    </a>
    <a class="tcard" href="/color/delta-e/">
      <div class="tcard-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/></svg></div>
      <div class="tcard-body"><strong>Back to the calculator</strong><span>Put this to work on a real master/sample pair</span></div>
    </a>
  </div>
</div>

<script src="../assets/glossary.js"></script>
<script>
(function () {
  var input = document.getElementById('glossary-search');
  var list = document.getElementById('term-list');

  function render(query) {
    var matches = query.trim() ? Glossary.search(query) : Glossary.TERMS;
    if (!matches.length) {
      list.innerHTML = '<div class="search-empty">No matching term.</div>';
      return;
    }
    list.innerHTML = matches.map(function (e) {
      return '<div class="search-result"><strong>' + e.term + '</strong><span>' + e.definition + '</span></div>';
    }).join('');
  }

  var initialQuery = new URLSearchParams(location.search).get('q') || '';
  input.value = initialQuery;
  render(initialQuery);
  input.addEventListener('input', function () { render(input.value); });

  // FAQPage structured data, built from the same glossary data shown above.
  var faq = {
    '@context': 'https://schema.org',
    '@type': 'FAQPage',
    mainEntity: Glossary.TERMS.map(function (e) {
      return {
        '@type': 'Question',
        name: 'What is ' + e.term.replace(/\s*\(.*?\)\s*/g, '') + '?',
        acceptedAnswer: { '@type': 'Answer', text: e.definition }
      };
    })
  };
  var ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(faq);
  document.head.appendChild(ldScript);
})();
</script>
</body>
</html>
